[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "group-collaboration-starter"
version = "0.1.0"
description = "Starter for Group Collaboration Software Assignment v0.1"
requires-python = ">=3.10"

[project.scripts]
groupctl = "groupctl.cli:main"

[tool.setuptools.packages.find]
include = ["groupctl*"]
